locale: en-US
title: Pranjali Jain
title_separator: '-'
name: Pranjali Jain
description: Ph.D. student at University of California, Santa Barbara
url: https://pranjalijain.github.io
baseurl: ''
repository: PranjaliJain/pranjalijain.github.io
author:
  avatar: MSR_photo_cropped.jpg
  employer: UC Santa Barbara
  email: pranjali_jain@ucsb.edu
  CV: /files/Pranjali_Jain_PhD_CV.pdf
  googlescholar: https://scholar.google.com/citations?hl=en&user=vAqe0GkAAAAJ
  github: PranjaliJain
  linkedin: pranjali-jain
include:
- _pages
exclude:
- Gemfile
- Gemfile.lock
- README.md
- LICENSE
- THIRD_PARTY_LICENSES.md
- vendor
- node_modules
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed
timezone: America/Los_Angeles
plugins:
- jekyll-sitemap
- jekyll-redirect-from
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: archive
    author_profile: false
compress_html:
  clippings: all
  ignore:
    envs:
    - development
