<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="{{ '/' | relative_url }}">Pranjali Jain</a>
    <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
